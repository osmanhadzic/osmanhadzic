name: Update profile stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  refresh-profile-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh GitHub stats cards
        env:
          USERNAME: osmanhadzic
        run: |
          mkdir -p assets
          curl -L "https://github-readme-stats.vercel.app/api?username=${USERNAME}&show_icons=true&theme=dark" -o assets/stats.svg
          curl -L "https://github-readme-streak-stats.herokuapp.com?user=${USERNAME}&theme=dark&background=282C34&ring=CE676E&fire=8DB473&currStreakNum=CE676E&currStreakLabel=CE676E&sideLabels=CE676E" -o assets/streak.svg
          curl -L "https://github-readme-activity-graph.vercel.app/graph?username=${USERNAME}&theme=react-dark" -o assets/activity.svg

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile stats assets"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying..."
            sleep 2
          done
          echo "Failed to push refreshed assets after multiple attempts."
          exit 1
